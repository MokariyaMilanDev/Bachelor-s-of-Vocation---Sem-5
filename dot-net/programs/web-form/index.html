<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Web Form</h1>
        <p>Hello Devs!</p>
      </header>
      <section>
        <form action="">
          <table border="1">
            <tr>
              <td>
                <label for="first_name"> First Name: </label>
              </td>
              <td>
                <input
                  type="text"
                  id="first_name"
                  name="first_name"
                  placeholder="Enter your name..."
                  title="Your name is required to process form..."
                  required
                />
              </td>
            </tr>
            <tr>
              <td>
                <label for="password"> Password: </label>
              </td>
              <td>
                <input
                  type="text"
                  id="password"
                  name="password"
                  placeholder="Enter your password..."
                  title="Your password is required to process form..."
                  required
                />
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <button style="width: 100%">Process</button>
              </td>
            </tr>
          </table>
        </form>
      </section>
    </main>
  </body>
</html>
